[project]
name = "universal-memory-langgraph"
version = "0.1.0"
description = "Optional LangGraph integration for the universal-memory SDK. Never a core Memory Service dependency."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
  "universal-memory",
  "pydantic>=2.13,<3",
]

[project.optional-dependencies]
langgraph = ["langgraph>=1.2"]
dev = ["pytest>=9", "pytest-asyncio>=1.4", "langgraph>=1.2"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/universal_memory_langgraph"]

[tool.uv.sources]
universal-memory = { workspace = true }
