name: ci

on:
  push:
    branches: [main]
  pull_request:

# A newer push to a pull request cancels the run of the commit it replaced: only the head's
# result can merge it. A run on main is never cancelled (one group per commit).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    # requires-python is ">=3.12": every supported minor version is proven, not just the oldest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: memory
          POSTGRES_PASSWORD: memory
          POSTGRES_DB: memory
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U memory" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
      # The server-backed deployment profile (tests/contract/test_deployment_profiles.py)
      # pings Qdrant as a mandatory dependency, and the search contract runs against a real
      # server when MEMORY_TEST_QDRANT_URL is set: without it that profile failed and the
      # contract never ran. Same version as docker-compose.yml.
      qdrant:
        image: qdrant/qdrant:v1.18.2
        ports: ["6333:6333", "6334:6334"]
    env:
      MEMORY__DATABASE__URL: postgresql+psycopg://memory:memory@localhost:5432/memory
      MEMORY__CACHE__URL: redis://localhost:6379/0
      # the gcs blob contract and tests/integration/test_gcs_blob.py, against the fake GCS
      # server started below; without it both skipped (no credentials)
      MEMORY_TEST_GCS_EMULATOR: http://localhost:4443
      # tests/unit/test_vendored_sdk.py compares the vendored copies with these checkouts; it
      # looks beside this repository by default, where CI has nothing, and skipped
      BIFROST_SDK: .bifrost-sdk
      TRELLIS_CONTRACTS: .agent-contracts
    steps:
      - uses: actions/checkout@v4
      # The model client and the contracts are path dependencies on vendor/bifrost-sdk and
      # vendor/trellis-contracts, and vendor/ is generated (gitignored) because a Docker
      # build cannot reach a sibling directory. A fresh checkout therefore does not have it,
      # and `uv sync` below died on "Distribution not found at: .../vendor/bifrost-sdk" as
      # the first real step of the job — which is why nothing downstream of it had ever run.
      - uses: actions/checkout@v4
        with:
          repository: amitmohapatra/bifrost-sdk
          path: .bifrost-sdk
      - uses: actions/checkout@v4
        with:
          repository: amitmohapatra/agent-contracts
          path: .agent-contracts
      - run: make vendor BIFROST_SDK=.bifrost-sdk TRELLIS_CONTRACTS=.agent-contracts
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      # the light extras whose tests otherwise skip here: gcp (the GCS blob store), hindsight
      # (its SDK contract), eval (datasets, to fetch the SciFact distractor corpus below),
      # google and aws (the model auth strategies' conformance tests)
      - run: uv sync --dev --extra gcp --extra hindsight --extra eval --extra google --extra aws
      # A step, not a service container: a service cannot be given the arguments that make
      # the server speak plain HTTP from memory.
      - run: >-
          docker run -d --name fake-gcs -p 4443:4443 fsouza/fake-gcs-server:1.56.1
          -scheme http -port 4443 -backend memory -external-url http://localhost:4443
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run pytest tests/unit sdk/python/tests -m "not docker and not models" -q
      # the SDK's public API against the base branch's: a changed signature needs a new SDK
      # version and a CHANGELOG entry naming it (sdk/python/tests/test_public_api.py holds the
      # snapshot to the code; this holds it to the base, so a hand-edited snapshot is caught)
      - if: github.event_name == 'pull_request'
        run: |
          git fetch --depth 1 origin "${{ github.base_ref }}"
          uv run python scripts/sdk_api.py --check-base FETCH_HEAD
      # ``live_llm``: the live-endpoint tests, which need a running model endpoint and its key;
      # models as on every other step (the runner has Docker, so the OpenFGA contract stays in)
      - run: uv run pytest tests/contract -m "not live_llm and not models" -q
        env:
          # dedicated backends for the cache and search contracts (CI's own, so they may be
          # written freely); the cache contract uses its own database index
          MEMORY_TEST_CACHE_URL: redis://localhost:6379/1
          MEMORY_TEST_QDRANT_URL: http://localhost:6333
          MEMORY_TEST_QDRANT_GRPC_PORT: "6334"
      - run: uv run alembic upgrade head && uv run alembic downgrade base && uv run alembic upgrade head
      - run: uv run pytest tests/integration -m "not docker and not models" -q
      - run: uv run pytest tests/security -q
      - run: uv run pytest tests/e2e -m "not docker and not models" -q
      - run: uv run pytest tests/agent -m "not docker and not models" -q
      # tests/eval/test_capability_coverage.py reads the corpus; it is git-ignored
      - run: make bench-external-prepare
      - run: uv run pytest tests/eval -m "not models" -q
      - run: uv run pytest tests/failure -m "not docker and not models" -q
      - name: OpenAPI schema diff
        run: |
          uv run python -m memory_service.tools.export_openapi /tmp/openapi.json
          diff -q docs/openapi.json /tmp/openapi.json
      # Every relative link and anchor in the repository's Markdown resolves, and every
      # snippet in the docs calls SDK methods and keywords that exist (scripts/check_docs.py).
      - run: make docs-check
      # The numbered examples, offline: an in-process service on this job's PostgreSQL.
      - run: make examples
