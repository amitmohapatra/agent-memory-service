# Run the reranker as its own tier.
#
#   docker compose -f docker-compose.yml -f docker-compose.models.yml --profile models up -d
#
# The reranker is ~87% of per-request model cost, so it is the one worth scaling on its own
# (`--scale tei-rerank=N`). The embedding model stays in-process: it is small, called once
# per query, and serving it separately needed a 14.3 GB image for a 130 MB model.
services:
  memory-api:
    environment:
      MEMORY__MODELS__EMBEDDING__URL: http://memory-embed:80
      MEMORY__MODELS__RERANKER__URL: http://tei-rerank:80
      MEMORY__MODELS__RERANKER__MODEL: /models/ms-marco-MiniLM-L6-v2
    depends_on:
      memory-embed:
        condition: service_healthy
      tei-rerank:
        condition: service_healthy

  memory-worker:
    # The worker embeds at ingestion but never reranks — retrieval is the reranker's only
    # consumer — so it needs the embedding service and nothing else.
    environment:
      MEMORY__MODELS__EMBEDDING__URL: http://memory-embed:80
    depends_on:
      memory-embed:
        condition: service_healthy
