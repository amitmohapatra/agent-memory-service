[project]
name = "trellis-memory"
version = "0.4.0"
description = "Python SDK for trellis-memory, the multi-agent memory service. Bind a context, chat, get a ContextBundle."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
  "httpx>=0.28",
  "pydantic>=2.13,<3",
]

[project.optional-dependencies]
# ``traceparent`` is injected from the active span when the OpenTelemetry API is importable.
otel = ["opentelemetry-api>=1.30"]
dev = ["trellis-memory[otel]", "opentelemetry-sdk>=1.30", "pytest>=9", "pytest-asyncio>=1.4", "respx>=0.22"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# ``trellis`` is a namespace package shared by every trellis-* distribution: no __init__.py.
packages = ["src/trellis"]
