[project]
name = "universal-memory"
version = "0.1.0"
description = "Python SDK for the Enterprise Multi-Agent Memory Service. Bind a context, chat, get a ContextBundle."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
  "httpx>=0.28",
  "pydantic>=2.13,<3",
]

[project.optional-dependencies]
dev = ["pytest>=9", "pytest-asyncio>=1.4", "respx>=0.22"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/universal_memory"]
