; PgBouncer in front of the request path (docker-compose `pgbouncer`), transaction mode.
;
; Transaction pooling hands a client a server connection for one transaction and takes it
; back, so the many short transactions of several API workers share far fewer PostgreSQL
; backends than they hold client connections. Its price is that nothing may outlive a
; transaction, which decides how the service connects (docs/deploy/database.md, ADR 0031):
;
; * the app runs with MEMORY__DATABASE__TRANSACTION_POOLER=true: psycopg prepares no
;   server-side statements (prepare_threshold=None) and sends no `options` startup
;   parameter; the statement timeout is set here instead, on every server connection;
; * Procrastinate (LISTEN/NOTIFY, job locks across statements), the graph traversal
;   (session statement_timeout, prepared plan) and migrations (locks, session SETs) connect
;   to PostgreSQL directly through MEMORY__DATABASE__DIRECT_URL;
; * the service's own advisory locks are pg_advisory_xact_lock - transaction-scoped, so
;   they are released with the transaction and safe here.

[databases]
; statement_timeout matches constants.DATABASE.statement_timeout_ms (asserted by
; tests/unit/test_process_model.py)
memory = host=postgres port=5432 dbname=memory connect_query='SET statement_timeout=15000'

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = transaction
; client side: every API worker's request pool, of every API container
max_client_conn = 1000
; server side, per (database, user): what the request path may hold on PostgreSQL. With
; the direct pools (graph 8 + queue 4 per process) this stays inside max_connections=200.
default_pool_size = 40
reserve_pool_size = 10
reserve_pool_timeout = 3
; longer than the app's pool_recycle (300 s), so the app retires a connection first
server_idle_timeout = 600
server_lifetime = 3600
; psycopg sends this one; anything else in the startup packet is refused, on purpose
ignore_startup_parameters = extra_float_digits
; protocol-level prepared statements are off on the client side; keep them off here too
max_prepared_statements = 0
admin_users = memory
stats_users = memory
