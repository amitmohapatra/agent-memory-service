name: memory-service

# Everything here is a fact about *this compose topology* that a .env file cannot know:
# service DNS names, container filesystem paths, and the provider that matches the container
# actually running beside you. compose `environment:` overrides `env_file:`, which is exactly
# right for these — an operator must not be able to point the service at a database that is
# not the one compose started.
#
# Everything an operator *chooses* lives in .env instead (see .env.example): log level,
# environment name, the LLM block, observability, authentication, tuning. Those reach the
# containers through `env_file:` below. Nothing belongs in both files — compose wins, so a
# duplicated line in .env is a value that looks set and is not.
x-common-env: &common-env
  MEMORY__DATABASE__URL: postgresql+psycopg://memory:memory@postgres:5432/memory
  MEMORY__CACHE__PROVIDER: dragonfly
  MEMORY__CACHE__URL: redis://dragonfly:6379/0
  MEMORY__SEARCH__PROVIDER: qdrant
  MEMORY__SEARCH__QDRANT_URL: http://qdrant:6333
  MEMORY__AUTHORIZATION__PROVIDER: openfga
  MEMORY__AUTHORIZATION__OPENFGA_API_URL: http://openfga:8080
  MEMORY__BLOB__PROVIDER: filesystem
  MEMORY__BLOB__FILESYSTEM_ROOT: /data/blob
  MEMORY__TASKS__PROVIDER: procrastinate
  MEMORY__MODELS__EMBEDDING__MODEL: ibm-granite/granite-embedding-small-english-r2
  MEMORY__MODELS__EMBEDDING__MODEL_PATH: /models/granite-embedding-small-english-r2
  MEMORY__MODELS__EMBEDDING__DIMENSION: "384"
  MEMORY__MODELS__RERANKER__MODEL: cross-encoder/ms-marco-MiniLM-L6-v2
  MEMORY__MODELS__RERANKER__MODEL_PATH: /models/ms-marco-MiniLM-L6-v2
  MEMORY__MODELS__NLI__MODEL_PATH: /models/deberta-v3-base-mnli-fever-anli
  # docling resolves its layout and table models from here instead of downloading them
  # on first use - the image is built with no network at runtime.
  MEMORY_DOCLING_ARTIFACTS: /models/docling
  # the image runs as `nobody` with HOME=/nonexistent, so any library that wants a cache
  # directory needs somewhere writable or it dies with PermissionError on first use.
  HF_HOME: /tmp/hf
  XDG_CACHE_HOME: /tmp/cache

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: memory
      POSTGRES_PASSWORD: memory
      POSTGRES_DB: memory
    command: ["postgres", "-c", "max_connections=200", "-c", "shared_buffers=256MB"]
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memory -d memory"]
      interval: 5s
      timeout: 3s
      retries: 20

  qdrant:
    image: qdrant/qdrant:v1.18.2
    ports: ["6333:6333", "6334:6334"]
    volumes: ["qdrant:/qdrant/storage"]
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:v1.40.1
    command: ["--maxmemory=1gb", "--proactor_threads=2"]
    ulimits:
      memlock: -1
    ports: ["6379:6379"]
    volumes: ["dragonfly:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  openfga-migrate:
    image: openfga/openfga:v1.18.1
    command: migrate
    environment:
      OPENFGA_DATASTORE_ENGINE: postgres
      OPENFGA_DATASTORE_URI: postgres://memory:memory@postgres:5432/openfga?sslmode=disable
    depends_on:
      openfga-db-init:
        condition: service_completed_successfully

  openfga:
    image: openfga/openfga:v1.18.1
    command: run
    environment:
      OPENFGA_DATASTORE_ENGINE: postgres
      OPENFGA_DATASTORE_URI: postgres://memory:memory@postgres:5432/openfga?sslmode=disable
      OPENFGA_LOG_FORMAT: json
      OPENFGA_PLAYGROUND_ENABLED: "true"
    ports: ["8081:8080", "8082:8081", "3000:3000"]
    depends_on:
      openfga-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=openfga:8081"]
      interval: 5s
      timeout: 3s
      retries: 30

  openfga-db-init:
    image: postgres:16-alpine
    entrypoint: ["sh", "-c", "until pg_isready -h postgres -U memory; do sleep 1; done; psql -h postgres -U memory -d memory -tc \"SELECT 1 FROM pg_database WHERE datname='openfga'\" | grep -q 1 || psql -h postgres -U memory -d memory -c 'CREATE DATABASE openfga'"]
    environment:
      PGPASSWORD: memory
    depends_on:
      postgres:
        condition: service_healthy

  # ------------------------------------------------------------------ one-shot setup
  # `docker compose up` on a fresh checkout has to produce a working service, so the two
  # things a working service needs that a checkout does not carry — the model weights and
  # the database schema — are created here rather than being left as manual steps whose
  # absence shows up as a crash loop at startup.

  model-fetch:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      target: runtime
    # ~1 GB the first time; afterwards each model is recognised as present and skipped.
    # Runs as root because ./models belongs to the host user, not to `nobody` — then hands
    # the files back to whoever owns the directory, so a Linux checkout is not left full of
    # root-owned weights the user cannot delete.
    entrypoint:
      - sh
      - -c
      - >-
        python -m memory_service.tools.download_models --dir /models &&
        chown -R "$$(stat -c '%u:%g' /models)" /models
    user: root
    restart: "no"
    volumes:
      - ./models:/models

  db-migrate:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      target: runtime
    entrypoint: ["sh", "-c", "alembic upgrade head && python -m memory_service.tools.ensure_queue_schema"]
    working_dir: /app
    environment:
      <<: *common-env
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  memory-api:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      target: runtime
    command: ["memory-api"]
    env_file:
      # Operator settings. Optional: every value has a working default, and anything compose
      # sets above wins over it.
      - path: .env
        required: false
    environment:
      <<: *common-env
    ports: ["8080:8080"]
    volumes:
      - blob:/data/blob
      - ./models:/models:ro
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      dragonfly:
        condition: service_healthy
      openfga:
        condition: service_started
      model-fetch:
        condition: service_completed_successfully
      db-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8080/health/live')"]
      interval: 10s
      timeout: 3s
      retries: 10
      # Startup loads three models from disk — embedding, reranker and a ~700MB NLI
      # cross-encoder. Measured cold start on 4 CPUs: ~6 minutes. Without a start_period,
      # interval x retries declared the container unhealthy after ~100s while it was still
      # legitimately loading, so `docker compose up` reported a broken stack that was about
      # to be fine. Probes that fail inside this window do not count against `retries`.
      start_period: 600s

  memory-worker:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      target: runtime
    command: ["memory-worker"]
    env_file:
      # Operator settings. Optional: every value has a working default, and anything compose
      # sets above wins over it.
      - path: .env
        required: false
    environment:
      <<: *common-env
    volumes:
      - blob:/data/blob
      - ./models:/models:ro
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      dragonfly:
        condition: service_healthy
      model-fetch:
        condition: service_completed_successfully
      db-migrate:
        condition: service_completed_successfully

  # ---------------------------------------------------------------- model tier
  #
  # One container per model, all from this image. `--profile models` starts them.
  #
  # The service does not load weights: it is given a URL per model and speaks HTTP to it.
  # A URL means "served over HTTP"; no URL means "loaded in-process", and the wire dialect
  # is detected from the server, so the URL is the only setting.
  #
  #   MEMORY__MODELS__EMBEDDING__URL=http://memory-embed:80
  #   MEMORY__MODELS__RERANKER__URL=http://memory-rerank:80
  #   MEMORY__MODELS__NLI__URL=http://memory-nli:80
  #   MEMORY__MODELS__SPARSE_URL=http://memory-sparse:80
  #
  # Why a tier at all: loading weights inside the API cost ~6 minutes of startup, a second
  # resident copy in the worker, and no way to scale ingestion apart from query traffic —
  # indexing a corpus starved the API because both competed for the same cores. Separating
  # them also means a native crash stays inside the process that caused it.
  #
  # Sizing: one retrieval request costs 1 query embedding and `reranker.candidate_k` (20)
  # cross-encoder pairs, so the reranker is ~87% of the model cost and the only one that
  # needs to track request rate — `docker compose up -d --scale memory-rerank=N`. Measure
  # with `make bench-model-throughput` ON THE TARGET HARDWARE: transformer inference leans
  # on AVX2/AVX-512/AMX and a machine without them is roughly an order of magnitude slower.
  #
  # These run our own image rather than a third-party inference server. It already carries
  # torch, FastAPI and the weights, so the extra containers share every layer and cost no
  # extra bytes on disk — and it loads every architecture here, which the obvious
  # off-the-shelf server did not: that one was 14.3 GB to serve a 130 MB model.
  #
  # To hold no weights in the API or the worker at all, add the overlay that sets those URLs
  # for you:
  #
  #   docker compose --profile models -f docker-compose.yml -f deploy/served-models.yml up -d
  #
  # (There was a second overlay, docker-compose.models.yml, removed on 2026-09-22: it did the
  # same job but had named `tei-rerank` since the service was renamed to `memory-rerank`, so
  # `docker compose config` refused the project outright. served-models.yml is the one that
  # works.)

  memory-embed:
    profiles: ["models"]
    build: {context: ., dockerfile: deploy/Dockerfile, target: runtime}
    command: ["memory-model"]
    environment:
      <<: *common-env
      MEMORY_MODEL_ROLE: embed
      MEMORY__MODELS__EMBEDDING__MODEL_PATH: /models/granite-embedding-small-english-r2
      MEMORY__MODELS__EMBEDDING__DIMENSION: "384"
      MEMORY_MODEL_PORT: "80"
    volumes: ["./models:/models:ro"]
    ports: ["8100:80"]
    healthcheck: &model-health
      # /health builds the model, so it stays red until the weights are actually resident —
      # "still loading" and "failed to start" must not look the same to an orchestrator.
      test: ["CMD", "python", "-c",
             "import urllib.request;urllib.request.urlopen('http://localhost:80/health')"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 300s

  memory-rerank:
    profiles: ["models"]
    build: {context: ., dockerfile: deploy/Dockerfile, target: runtime}
    command: ["memory-model"]
    environment:
      <<: *common-env
      MEMORY_MODEL_ROLE: rerank
      MEMORY__MODELS__RERANKER__MODEL_PATH: /models/ms-marco-MiniLM-L6-v2
      MEMORY_MODEL_PORT: "80"
    volumes: ["./models:/models:ro"]
    ports: ["8101:80"]
    # The capacity-defining tier: retrieval sends candidate_k pairs per request, so this is
    # what to scale when RPS rises — `docker compose up -d --scale memory-rerank=N`.
    healthcheck: *model-health

  memory-nli:
    profiles: ["models"]
    build: {context: ., dockerfile: deploy/Dockerfile, target: runtime}
    command: ["memory-model"]
    environment:
      <<: *common-env
      MEMORY_MODEL_ROLE: nli
      MEMORY__MODELS__NLI__MODEL_PATH: /models/deberta-v3-base-mnli-fever-anli
      MEMORY_MODEL_PORT: "80"
    volumes: ["./models:/models:ro"]
    ports: ["8102:80"]
    # Grounding verification only, and only once something has generated a claim. Its traffic
    # is unrelated to retrieval volume, which is the whole argument for a separate tier: the
    # worker otherwise loads ~700 MB of weights it may never call.
    healthcheck: *model-health

  memory-sparse:
    profiles: ["models"]
    build: {context: ., dockerfile: deploy/Dockerfile, target: runtime}
    command: ["memory-model"]
    environment:
      <<: *common-env
      MEMORY_MODEL_ROLE: sparse
      MEMORY__MODELS__SPARSE_MODEL_PATH: /models/Splade_PP_en_v1
      MEMORY_MODEL_PORT: "80"
    volumes: ["./models:/models:ro"]
    ports: ["8103:80"]
    # SPLADE is BERT-sized and runs on every chunk at ingest, so it is the largest
    # per-document cost in the system and the one with the strongest case for its own tier:
    # ingest volume and query volume have nothing to do with each other.
    healthcheck: *model-health

  # A gateway that presents OpenAI-compatible /v1/embeddings and Cohere-style /v1/rerank
  # over OpenAI, Cohere, Gemini, Azure or Bedrock. `--profile gateway`.
  #
  # This is what makes "connect a vendor tomorrow" a configuration change: the service speaks
  # one wire format, the gateway owns the vendor differences and the keys. Point the api and
  # worker at it with:
  #   MEMORY__MODELS__EMBEDDING__URL=http://model-gateway:4000
  #   MEMORY__MODELS__EMBEDDING__MODEL=text-embedding-3-small
  #   MEMORY__MODELS__EMBEDDING__DIMENSION=1536
  #   MEMORY__PROVIDER_POLICY__ALLOW_REMOTE_MODELS=true   # data leaves the deployment
  #
  # Changing the model changes the embedding fingerprint, so new collections are created and
  # `make reindex` repopulates them — the old vectors are never silently mixed with the new.
  # Note there is no hosted NLI endpoint anywhere: grounding keeps its local model or moves
  # to the LLM judge.
  model-gateway:
    profiles: ["gateway"]
    image: ghcr.io/berriai/litellm:main-stable
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    volumes: ["./deploy/model-gateway.yaml:/app/config.yaml:ro"]
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      COHERE_API_KEY: ${COHERE_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports: ["4000:4000"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:4000/health/liveliness"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 60s

  # The LLM gateway is NOT part of this stack.
  #
  # Bifrost is deployed separately and owns all outbound model traffic: provider keys, prompts
  # and MCP. This repository ships a *client* and nothing else — the service is given a URL, a
  # model name and (optionally) a virtual key, and no provider SDK is importable anywhere under
  # src (enforced by tests/unit/test_architecture.py). There is deliberately no gateway service
  # here: running one from this compose file would put provider keys inside the application's
  # own deployment, which is the coupling the gateway exists to remove.
  #
  #   MEMORY__MODELS__LLM__ENABLED=true
  #   MEMORY__MODELS__LLM__BASE_URL=https://<your-gateway>/v1
  #   MEMORY__MODELS__LLM__MODEL=<provider>/<model>
  #   MEMORY__MODELS__LLM__API_KEY=<virtual key issued by the gateway, not a provider key>
  #
  # With llm.enabled=false the service runs complete without any gateway at all; generation is
  # an enhancement, never a dependency.

  # Release-gate runner: the repository is bind-mounted so `make gates` / `make validate`
  # run on the working tree against the real services above with the weights in ./models.
  #   docker compose --profile validation up -d memory-validate
  #   docker compose exec memory-validate make validate
  memory-validate:
    profiles: ["validation"]
    build:
      context: .
      dockerfile: deploy/Dockerfile
      target: validation
    working_dir: /app
    environment:
      <<: *common-env
      MEMORY__DATABASE__URL: postgresql+psycopg://memory:memory@postgres:5432/memory
      MEMORY__SERVICE__LOG_LEVEL: WARNING
      MEMORY_MODELS_DIR: /models
      MEMORY__MODELS__EMBEDDING__MODEL_PATH: /models/granite-embedding-small-english-r2
      MEMORY__MODELS__RERANKER__MODEL_PATH: /models/ms-marco-MiniLM-L6-v2
      MEMORY__MODELS__NLI__MODEL_PATH: /models/deberta-v3-base-mnli-fever-anli
      MEMORY__MODELS__SPARSE_MODEL_PATH: /models/Splade_PP_en_v1
      MEMORY__BLOB__FILESYSTEM_ROOT: /app/.blob
      UV_PROJECT_ENVIRONMENT: /opt/venv
    volumes:
      - .:/app
      - ./models:/models
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      dragonfly:
        condition: service_healthy
      openfga:
        condition: service_started

  neo4j:
    profiles: ["graph-store", "graphiti"]
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/memorygraph
      NEO4J_PLUGINS: '["apoc"]'
    ports: ["7474:7474", "7687:7687"]
    volumes: ["neo4j:/data"]

  otel-collector:
    profiles: ["observability"]
    image: otel/opentelemetry-collector-contrib:latest
    command: ["--config=/etc/otel/config.yaml"]
    volumes: ["./deploy/otel/collector.yaml:/etc/otel/config.yaml:ro"]
    ports: ["4318:4318"]

  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v3
    volumes: ["./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]

volumes:
  pgdata:
  qdrant:
  dragonfly:
  blob:
  neo4j:
